name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; queued runs are superseded by newer pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # A project site is served from /<repo>/, a user site (<owner>.github.io)
      # from the root. Jekyll needs to know which, so that every internal link
      # and asset path gets the right prefix.
      # If you add a custom domain later, set baseurl to "" instead.
      - name: Work out the site URL
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo="${GITHUB_REPOSITORY#*/}"
          if [ "$(echo "$repo" | tr '[:upper:]' '[:lower:]')" = "$owner.github.io" ]; then
            baseurl=""
          else
            baseurl="/$repo"
          fi
          printf 'url: "https://%s.github.io"\nbaseurl: "%s"\n' "$owner" "$baseurl" > _config_pages.yml
          cat _config_pages.yml

      - name: Build with Jekyll
        run: bundle exec jekyll build --config _config.yml,_config_pages.yml
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
